name: release

on:
    release:
        types: [published]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: 24
                  cache: npm

            # The Novaris installer strips a leading "v" from the tag and looks
            # for "{slug}.{version}.zip", then compares that version against
            # theme.json. Fail early if the tag and theme.json disagree.
            - name: Resolve version
              id: version
              run: |
                  TAG="${{ github.event.release.tag_name }}"
                  VERSION="${TAG#v}"
                  SLUG=$(node -p "require('./theme.json').slug")
                  THEME_VERSION=$(node -p "require('./theme.json').version")

                  if [ "$VERSION" != "$THEME_VERSION" ]; then
                      echo "::error::Release tag ($TAG) does not match theme.json version ($THEME_VERSION)."
                      exit 1
                  fi

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  echo "zip=$SLUG.$VERSION.zip" >> "$GITHUB_OUTPUT"

            - name: Install Node dependencies
              run: npm ci

            - name: Build
              run: npm run build

            - name: Create ZIP
              run: zip -r "${{ steps.version.outputs.zip }}" amicable/

            - name: Upload ZIP to GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release upload "${{ github.event.release.tag_name }}" \
                    "${{ steps.version.outputs.zip }}" \
                    --clobber